[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modhub-sample-failed-strategy"
version = "0.1.0"
description = "FastAPI service pinned to Pydantic v1 by a dependency that never supported v2."
requires-python = ">=3.10"
dependencies = ["fastapi==0.99.1", "pydantic>=1.10,<2", "httpx<0.28"]

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
